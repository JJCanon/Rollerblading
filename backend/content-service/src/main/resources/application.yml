server:
  port: ${PORT:3002}

spring:
  application:
    name: content-service
  data:
    mongodb:
      uri: ${DATABASE_URL}

jwt:
  secret: ${JWT_SECRET}

instagram:
  graph-api-token: ${INSTAGRAM_GRAPH_API_TOKEN:}
  sync-interval-ms: ${INSTAGRAM_SYNC_INTERVAL_MS:1800000}

logging:
  level:
    com.rollerblading.content: DEBUG