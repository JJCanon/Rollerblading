name: rollerblading-website

services:
  # databases
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks: [rollerblading-net]

  events-db:
    image: postgres:16-alpine
    container_name: events-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EVENTS_DB_USER}
      POSTGRES_PASSWORD: ${EVENTS_DB_PASSWORD}
      POSTGRES_DB: ${EVENTS_DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - events_db_data:/var/lib/postgresql/data
    networks: [rollerblading-net]

  store-db:
    image: postgres:16-alpine
    container_name: store-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STORE_DB_USER}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD}
      POSTGRES_DB: ${STORE_DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - store_db_data:/var/lib/postgresql/data
    networks: [rollerblading-net]

  content-db:
    image: mongo:7
    container_name: content-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${CONTENT_DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${CONTENT_DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${CONTENT_DB_NAME}
    ports:
      - "5436:27017"
    volumes:
      - content_db_data:/data/db
    networks: [rollerblading-net]

  # microservices
  api-gateway:
    build: ./backend/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    env_file:
      - ./backend/api-gateway/.env
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - content-service
      - events-service
      - store-service
    networks: [rollerblading-net]

  auth-service:
    build: ./backend/auth-service
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./backend/auth-service/.env
    environment:
      DATABASE_URL: postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME}
    ports:
      - "3001:3001"
    depends_on:
      - auth-db
    networks: [rollerblading-net]

  content-service:
    build: ./backend/content-service
    container_name: content-service
    restart: unless-stopped
    env_file:
      - ./backend/content-service/.env
    environment:
      DATABASE_URL: mongodb://${CONTENT_DB_USER}:${CONTENT_DB_PASSWORD}@content-db:27017/${CONTENT_DB_NAME}?authSource=admin
    ports:
      - "3002:3002"
    depends_on:
      - content-db
    networks: [rollerblading-net]
  
  events-service:
    build: ./backend/events-service
    container_name: events-service
    restart: unless-stopped
    env_file:
      - ./backend/events-service/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${EVENTS_DB_USER}:${EVENTS_DB_PASSWORD}@events-db:5432/${EVENTS_DB_NAME}
    ports:
      - "3003:3003"
    depends_on:
      - events-db
    networks: [rollerblading-net]

  store-service:
    build: ./backend/store-service
    container_name: store-service
    restart: unless-stopped
    env_file:
      - ./backend/store-service/.env
    environment:
      DATABASE_URL: postgres://${STORE_DB_USER}:${STORE_DB_PASSWORD}@store-db:5432/${STORE_DB_NAME}?sslmode=disable
    ports:
      - "3004:3004"
    depends_on:
      - store-db
    networks: [rollerblading-net]


networks:
  rollerblading-net:
    driver: bridge

volumes:
  auth_db_data:
  events_db_data:
  store_db_data:
  content_db_data: